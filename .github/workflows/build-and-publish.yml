name: Build and Release Userscripts

on:
  push:
    branches: ["5.0"]
    tags: ["v5.*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: userscript-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.repository == 'E7G/ocsjs-with-uxy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile shared utils
        run: pnpm exec tsc -p packages/utils/tsconfig.json

      - name: Build userscripts and verify metadata
        run: pnpm build

      - name: Check scripts TypeScript after building core
        run: pnpm exec tsc --noEmit -p packages/scripts/tsconfig.json

      - name: Verify release tag and branch history
        if: startsWith(github.ref, 'refs/tags/v5.')
        run: |
          git fetch origin 5.0
          git merge-base --is-ancestor HEAD origin/5.0
          node -e "const fs=require('node:fs');const m=fs.readFileSync('dist/ocs.meta.js','utf8').match(/^\/\/\s*@version\s+(\S+)/m);const actual=m?.[1];const expected=process.env.GITHUB_REF_NAME.slice(1);if(actual!==expected){console.error('Release tag '+expected+' does not match @version '+actual);process.exit(1)}"

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ocs-with-uxy-${{ github.run_id }}
          path: |
            dist/ocs.user.js
            dist/ocs.meta.js
            dist/ocs.common.user.js
            dist/ocs.common.meta.js
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v5.')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/ocs.user.js
            dist/ocs.meta.js
            dist/ocs.common.user.js
            dist/ocs.common.meta.js
